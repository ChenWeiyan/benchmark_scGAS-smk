name: r_benchmark
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.3
  - r-seurat=5.0
  - r-signac>=1.13.0               # CRAN package; 1.12 TSSEnrichment() breaks on SeuratObject v5
  - bioconductor-genomicranges
  - bioconductor-genomeinfodb
  - bioconductor-rtracklayer
  - bioconductor-ensdb.hsapiens.v75
  - bioconductor-ensdb.hsapiens.v86
  - bioconductor-rsamtools
  - r-scavenge=1.0.2               # not a Bioconductor package
  - bioconductor-matrixgenerics
  - bioconductor-biovizbase        # Signac TSS functions
  - r-hdf5r                        # Seurat::Read10X_h5
  - r-matrix
  - r-data.table
  - r-ggplot2
  - r-patchwork
  - r-ggridges
  - r-glmnet
  - r-glmnetutils
  - r-igraph
  - r-aricode
  - r-devtools
  - r-remotes
  # ArchR (install manually if benchmarking archr):
  # devtools::install_github("GreenleafLab/ArchR", ref="master", repos=BiocManager::repositories())
  # Cicero (install manually if benchmarking cicero):
  # devtools::install_github("cole-trapnell-lab/monocle3")
  # BiocManager::install("cicero")
